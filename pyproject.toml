[project]
name = "langchain-react"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ayush Sharma", email = "ayush.as.sharma09@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "grandalf>=0.8",
    "isort>=9.0.1",
    "langchain>=1.4.0",
    "langchain-community>=0.3.0",
    "duckduckgo-search>=6.0.0",
    "ddgs>=0.1.0",
    "langchain-gemini>=0.1.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
langchain-react = "langchain_react:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
